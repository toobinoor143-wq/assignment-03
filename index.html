<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission  Admission Form</title>
</head>
<header>
    <h1>Student Admission Form</h1>
    <p>Please fill out the form to apply for admission.</p>
</header>
<main>
    <form action="form">
        <fieldset>
            <legend>
              <h3>  Personal Information </h3>
            </legend>
            <label for="fullname">Full Name:</label>
            <input type="text"
            id="name"
            minlength="3"
            placeholder="Enter your name"
            required>
            <br>
            <br>
            <label for="Email">Email Address:</label>
            <input type="email"
            id="email"
            placeholder="example@email.com"
            required
            >
            <br><br>
           

            <label for="phone Number">Phone Number:</label>
            <input type="tel"
            id="Phone"
            name: Phone
            placeholder="Enter your phone number"

            >
            <br><br>
            <label for="Age">Age:</label>
            <input type="number"
            id="Age"
            name="Age"
            min="16"
            max="60">
            <br><br>
            <label for="City">Enter your City:</label>
            <select name="City" id="city">City:
                <option value="">--select city--</option>
                <option value="islamabad">islamabad</option>
                <option value="Rawalpindi">Rawalpindi</option>
                <option value="karachi">karachi</option>
                <option value="Lahore">Lahore</option>
                <option value="Azad kashmir">Azad kashmir</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Course Selection</b></legend>
            <label for="Course">Choose Your Course:</label>
            <select id="course" name="course" required> 
                <option value="">Select a course</option> 
                <option value="web-development">Web Development</option> 
                <option value="graphic-design">Graphic Design</option> 
                <option value="digital-marketing">Digital Marketing</option>
                <option value="artificial-intelligence">Artificial Intelligence</option>
                 </select>
        </fieldset>
        <br>
        <fieldset>
            <legend><b> Preferred Class Shift</b></legend>
            <input type="radio"
            id="Morning "
            name="shift"
            value="morning"
            required>
            <label for="Morning">Morning</label>

        <br>
        <input type="radio" 
        id="evening"
         name="shift" 
         value="Evening">
          <label for="evening">Evening</label>

        <br>

        <input type="radio" 
        id="weekend"
         name="shift"
         value="Weekend"> 
         <label for="weekend">Weekend</label> 
        </fieldset>
        <br>
        <fieldset> 
            <legend><b>Existing Skills (Optional)</b></legend> 
            <input type="checkbox" 
            id="html"
            name="skills"
            value="HTML"> 
            <label for="html">HTML</label> <br>
            <input type="checkbox"
            id="css"
            name="skills"
            value="CSS"
            >
            <label for="skills">CSS</label>
            <br>

            <input type="checkbox" 
            id="javascript"
            name="skills" 
            value="JavaScript"> 
            <label for="javascript">JavaScript</label> <br>

            <input type="checkbox" 
            id="python" 
            name="skills" 
            value="Python"> 
            <label for="python">Python</label> 
        </fieldset> <br>

        <fieldset>
            <legend><b>Motivatation</b>
            </legend>
            <label for="motivation"> Why do you want to join this course?</label>
            <br>

            <textarea id="motivation" 
            name="motivation"  
            minlength="10" 
            maxlength="200" 
            placeholder="Write your reason here..." required></textarea>
        </fieldset>

        <br>

        <fieldset>
             <legend><b>Additional Information (Optional)</b></legend> 
             <label for="portfolio">Portfolio Website URL:</label> 
             <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com"> <br><br> 
             <label for="startdate">Preferred Starting Date:</label> 
             <input type="date" id="startdate" name="startdate"> 
            </fieldset> <br> 
            <button type="submit">Submit Application</button> 
            <button type="reset">Reset Form</button> 
            <footer> <p>&copy; 2026 Student Admission Form</p> </footer>
         

    </form>
</main>
<body>

</body>
</html>
